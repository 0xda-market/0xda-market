name: zero-x-da-market-${DEPLOY_ENV}

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    expose:
      - "10000"
    networks:
      edge:
        aliases:
          - market-api-${DEPLOY_ENV}
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fx-refresh:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    command:
      - bundle
      - exec
      - ruby
      - bin/refresh_fx_rates_loop
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  price-refresh:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    command:
      - bundle
      - exec
      - ruby
      - bin/refresh_market_prices_loop
    depends_on:
      api:
        condition: service_healthy
      fx-refresh:
        condition: service_started
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mcp-control:
    image: alpine:3.22
    restart: unless-stopped
    init: true
    user: "65532:65532"
    depends_on:
      api:
        condition: service_healthy
    command:
      - /opt/mcp-control/mcp-control
      - agent
      - --config
      - /etc/mcp-control/agent.json
    volumes:
      - ./mcp-control/bin/mcp-control:/opt/mcp-control/mcp-control:ro
      - ./mcp-control/config:/etc/mcp-control:ro
    networks:
      - edge
    tmpfs:
      - /run/mcp-control:rw,noexec,nosuid,nodev,size=1m,mode=0750,uid=65532,gid=65532
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777,uid=65532,gid=65532
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - /opt/mcp-control/mcp-control
        - servers
        - list
        - --config
        - /etc/mcp-control/agent.json
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: ${MARKET_EDGE_NETWORK:-nilx-edge}
    external: true
