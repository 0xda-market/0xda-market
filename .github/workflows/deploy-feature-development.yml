name: Deploy feature branch to development

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  actions: write
  contents: read
  statuses: read

jobs:
  dispatch:
    if: >-
      github.event.pull_request.number == 107 &&
      github.event.pull_request.head.ref == 'feature/telegram-premium-sourcing-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Dispatch immutable development deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          payload="$(jq -nc \
            --arg ref master \
            --arg source_ref "$RELEASE_SHA" \
            '{ref:$ref,inputs:{source_ref:$source_ref,environment:"development"}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-vps.yml/dispatches" \
            --data "$payload"
          echo "Dispatched development deployment for $RELEASE_SHA"

      - name: Wait for VPS health status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 80); do
            state="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/statuses?per_page=100" \
              | jq -r '[.[] | select(.context == "deploy/vps-core-development")][0].state // empty')"
            case "$state" in
              success)
                echo "Development deployment is healthy for $RELEASE_SHA"
                exit 0
                ;;
              failure|error)
                echo "::error::Development deployment reported $state for $RELEASE_SHA"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for deploy/vps-core-development on $RELEASE_SHA"
          exit 1
